services:
  postgres:
    image: postgres:16-alpine
    container_name: balcao-postgres
    environment:
      POSTGRES_DB: balcao
      POSTGRES_USER: balcao
      POSTGRES_PASSWORD: balcao
    ports:
      - "5432:5432"
    volumes:
      - balcao-dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U balcao -d balcao"]
      interval: 5s
      retries: 10

volumes:
  balcao-dados:
