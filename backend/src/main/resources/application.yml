server:
  port: 8080
  # Termina as requisições em andamento (ex.: finalização de venda) antes de desligar.
  shutdown: graceful

spring:
  application:
    name: balcao-pdv
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/balcao}
    username: ${DB_USER:balcao}
    password: ${DB_PASSWORD:balcao}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  web:
    resources:
      # Em produção o backend também serve a tela (frontend/dist): um endereço só para todos os caixas.
      static-locations: classpath:/static/, file:${BALCAO_FRONTEND:../frontend/dist}/
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

balcao:
  cors-origins: ${CORS_ORIGINS:http://localhost:5173}
