server:
  port: 8080

spring:
  application:
    name: balcao-pdv
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/balcao}
    username: ${DB_USER:balcao}
    password: ${DB_PASSWORD:balcao}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

balcao:
  cors-origins: ${CORS_ORIGINS:http://localhost:5173}
  estoque:
    # PERMITIR_E_AVISAR (padrão) ou BLOQUEAR
    politica-saldo-insuficiente: ${ESTOQUE_POLITICA:PERMITIR_E_AVISAR}
